[program:pawfect]
command=/var/www/pawfect/venv/bin/gunicorn core.wsgi:application -b 127.0.0.1:8000 -w 4 --timeout 120
directory=/var/www/pawfect
user=www-data
autostart=true
autorestart=true
stderr_logfile=/var/log/pawfect.err.log
stdout_logfile=/var/log/pawfect.out.log
environment=DJANGO_SETTINGS_MODULE="core.settings.prod"